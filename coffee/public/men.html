<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>MACH Cafe — Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'Lastica';
  src: url('../fonts/NobodyTalks-oZo4.ttf') format('truetype');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --cream:#FFFFFF;
  --espresso:#3B1F0C;
  --mocha:#5A3520;
  --caramel:#7B4F2E;
  --latte:#A0714F;
  --foam:#F8F8F8;
  --text:#2A1408;
  --muted:#8A6B55;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Jost',sans-serif;
  background:var(--foam);
  color:var(--text);
  overflow-x:hidden;
}

/* NAVBAR */

/* NAV */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 4rem;
    background: rgba(250,245,236,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,131,42,0.2);
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--espresso); letter-spacing: 1px; text-decoration: none; }
  .nav-logo span { color: var(--caramel); }
  .nav-links { display: flex; gap: 0; list-style: none; }
  .nav-links a {
    text-decoration: none; font-size: 0.78rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; color: var(--mocha);
    padding: 0.5rem 1.4rem; transition: all 0.3s; border-bottom: 2px solid transparent;
  }
  .nav-links a:hover { color: var(--caramel); }
  .nav-links a.active { color: var(--caramel); border-bottom-color: var(--caramel); }
  .nav-reserve {
    background: var(--espresso); color: var(--cream) !important;
    padding: 0.6rem 1.6rem !important; border-bottom: none !important;
    border-radius: 0 !important;
  }
  .nav-reserve:hover { background: var(--mocha) !important; }


.logout-btn{
  background:none;
  border:1px solid rgba(212,169,106,0.3);
  color:var(--latte);
  padding:0.5rem 1.2rem;
  cursor:pointer;
  font-size:0.75rem;
  letter-spacing:2px;
  text-transform:uppercase;
}

.logout-btn:hover{
  border-color:var(--caramel);
  color:var(--caramel);
}

/* HERO */

.menu-hero{
  min-height:38vh;
  background:var(--espresso);
  display:flex;
  align-items:flex-end;
  padding:4rem;
  position:relative;
  overflow:hidden;
}

.menu-hero::before{
  content:'MENU';
  position:absolute;
  right:-1rem;
  bottom:-2rem;
  font-family:'Playfair Display',serif;
  font-size:22vw;
  font-weight:700;
  color:rgba(255,255,255,0.03);
}

.menu-hero-content{
  position:relative;
  z-index:2;
  padding-top:5rem;
}

.menu-tag{
  font-size:0.72rem;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--caramel);
  margin-bottom:1rem;
  display:block;
}

.menu-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,6vw,5rem);
  color:white;
}

.menu-title em{
  color:var(--caramel);
}

.menu-sub{
  color:rgba(255,255,255,0.55);
  max-width:550px;
  margin-top:1rem;
  line-height:1.7;
}

/* MENU NAV */

.menu-nav{
  position:sticky;
  top:75px;
  z-index:90;
  background:var(--espresso);
  padding:0 4rem;
  display:flex;
  overflow-x:auto;
}

.menu-nav::-webkit-scrollbar{
  display:none;
}

.mnav-btn{
  padding:1rem 1.5rem;
  background:none;
  border:none;
  color:rgba(255,255,255,0.5);
  cursor:pointer;
  letter-spacing:2px;
  text-transform:uppercase;
  font-size:0.75rem;
  border-bottom:3px solid transparent;
  transition:0.3s;
}

.mnav-btn:hover,
.mnav-btn.active{
  color:var(--caramel);
  border-bottom-color:var(--caramel);
}

/* SECTIONS */

.menu-section{
  padding:5rem 4rem;
}

.menu-section:nth-child(odd){
  background:var(--foam);
}

.menu-section:nth-child(even){
  background:white;
}

.sec-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:2.5rem;
  border-bottom:1px solid rgba(123,79,46,0.15);
  padding-bottom:1.5rem;
}

.sec-icon{
  font-size:2.5rem;
}

.sec-title{
  font-family:'Playfair Display',serif;
  font-size:2rem;
  margin-left:1rem;
  color:var(--espresso);
}

.sec-desc{
  font-size:0.85rem;
  color:var(--muted);
  max-width:320px;
  text-align:right;
  line-height:1.6;
}

/* CARDS GRID */
.items-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5px; }
.menu-section:nth-child(even) .item-card { background:var(--foam); }
.menu-section:nth-child(odd) .item-card { background:var(--cream); }

/* BADGES */
.item-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.8rem; }
.item-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase; padding: 0.2rem 0.6rem; }
.badge-hot { background: rgba(123,79,46,0.12); color: var(--caramel); }
.badge-new { background: rgba(44,26,14,0.08); color: var(--espresso); }
.badge-vegan { background: rgba(76,153,76,0.1); color: #3a7a3a; }
.badge-cold { background: rgba(76,130,200,0.1); color: #2a5eaa; }
.badge-limited { background: rgba(180,60,60,0.1); color: #a03030; }

/* ITEM CARD UPDATES */
.item-card{ background:white; padding:2rem; transition:0.3s; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.item-card::before { content:''; position:absolute; left:0; top:0; width:4px; height:100%; background:var(--caramel); transform:scaleY(0); transform-origin:bottom; transition:transform 0.35s; }
.item-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(44,26,14,0.1); border-left-color:var(--caramel); }
.item-card:hover::before { transform:scaleY(1); }
.item-footer { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:1rem; border-top:1px solid rgba(123,79,46,0.1); }

/* FEATURED */
.item-card.featured { grid-column:span 3; flex-direction:row; align-items:center; gap:3rem; background:var(--espresso) !important; padding:3rem; }
.item-card.featured::before { width:100%; height:4px; bottom:0; top:auto; transform:scaleX(0); transform-origin:left; }
.item-card.featured:hover::before { transform:scaleX(1); }
.featured-visual { font-size:5rem; flex-shrink:0; }
.featured-tag { font-size:0.68rem; letter-spacing:3px; text-transform:uppercase; color:var(--caramel); border:1px solid rgba(123,79,46,0.3); padding:0.3rem 0.8rem; display:inline-block; margin-bottom:0.8rem; }
.item-card.featured .item-name { font-size:1.8rem; color:var(--cream); margin-bottom:0.8rem; }
.item-card.featured .item-desc { font-size:0.9rem; color:rgba(245,239,224,0.55); margin-bottom:0; }
.item-card.featured .item-price { font-size:2rem; color:var(--caramel); }
.item-card.featured .item-footer { border-top-color:rgba(255,255,255,0.08); }

/* OUT OF STOCK */
.item-card.oos { opacity:0.55; }
.oos-badge { font-size:0.62rem; letter-spacing:1.5px; text-transform:uppercase; background:rgba(180,60,60,0.13); color:#a03030; padding:0.2rem 0.6rem; }

@media(max-width:700px){
  .item-card.featured { grid-column:span 1; flex-direction:column; gap:1.5rem; }
}


/* FOOTER */

footer{
  background:#180C04;
  padding:3rem 4rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.f-logo{
  font-family:'Playfair Display',serif;
  color:white;
  font-size:1.3rem;
}

.f-links{
  display:flex;
  gap:2rem;
  list-style:none;
}

.f-links a{
  color:rgba(255,255,255,0.4);
  text-decoration:none;
  font-size:0.75rem;
  letter-spacing:2px;
  text-transform:uppercase;
}

.f-links a:hover{
  color:var(--caramel);
}

.f-copy{
  color:rgba(255,255,255,0.25);
  font-size:0.75rem;
}

/* HAMBURGER */

.nav-toggle{
  display:none;
  flex-direction:column;
  justify-content:center;
  gap:5px;
  cursor:pointer;
  padding:0.4rem;
  background:none;
  border:none;
  z-index:200;
}

.nav-toggle span{
  display:block;
  width:24px;
  height:2px;
  background:var(--espresso);
  transition:all 0.3s;
}

.nav-toggle.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.nav-toggle.open span:nth-child(2){ opacity:0; }
.nav-toggle.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

/* RESPONSIVE */

@media(max-width:992px){

  .items-grid{
    grid-template-columns:repeat(2,1fr);
  }

  nav,
  .menu-section,
  .menu-nav,
  footer{
    padding-left:2rem;
    padding-right:2rem;
  }
}

@media(max-width:700px){

  nav{
    padding:1rem 1.5rem;
  }

  .nav-toggle{
    display:flex;
  }

  .nav-links{
    display:none;
    flex-direction:column;
    gap:0;
    position:fixed;
    top:0;
    right:0;
    width:75%;
    max-width:280px;
    height:100vh;
    background:white;
    padding:5rem 2rem 2rem;
    box-shadow:-8px 0 32px rgba(0,0,0,0.1);
    z-index:150;
    overflow-y:auto;
  }

  .nav-links.open{
    display:flex;
  }

  .nav-links li{
    border-bottom:1px solid rgba(123,79,46,0.1);
  }

  .nav-links a{
    display:block;
    padding:1rem 0;
  }

  .logout-btn{
    margin-top:0.5rem;
    width:100%;
  }

  .menu-hero{
    padding:1.5rem;
    min-height:auto;
  }

  .menu-hero-content{
    padding-top:5rem;
  }

  .menu-nav{
    padding:0 0.5rem;
    top:60px;
  }

  .mnav-btn{
    padding:0.85rem 0.9rem;
    font-size:0.7rem;
    letter-spacing:1px;
  }

  .menu-section{
    padding:3rem 1.5rem;
  }

  .items-grid{
    grid-template-columns:1fr;
  }

  .sec-header{
    flex-direction:column;
    align-items:flex-start;
    gap:1rem;
  }

  .sec-desc{
    text-align:left;
  }

  footer{
    padding:2rem 1.5rem;
    flex-direction:column;
    gap:1.5rem;
    text-align:center;
  }

  .f-links{
    flex-wrap:wrap;
    justify-content:center;
    gap:1rem;
  }
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">
    <span style="font-family: 'Lastica', sans-serif;">MACH </span>
    <em style="font-family: 'italic'; color:#3d2415; font-style: italic;">Cafe</em>
  </a>

  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>

  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="men.html" class="active">Menu</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="contact.html" class="nav-reserve">Reserve a Table</a></li>
    <!--<li><button class="logout-btn" onclick="logout()">Logout</button></li>-->
  </ul>
</nav>

<div class="menu-hero">
  <div class="menu-hero-content">
    <span class="menu-tag">Crafted with Intention</span>

    <div class="menu-title">
      Our Full <em>Menu</em>
    </div>

    <p class="menu-sub">
      Every cup, every bite — made with attention to flavour,
      quality, and comfort.
    </p>
  </div>
</div>

<div class="menu-nav">
  <button class="mnav-btn active" onclick="scrollToSection('coffees',this)">Hot Coffees &amp; Beverages</button>
  <button class="mnav-btn" onclick="scrollToSection('cold',this)">Juices</button>
  <button class="mnav-btn" onclick="scrollToSection('shakes',this)">Mojitos</button>
  <button class="mnav-btn" onclick="scrollToSection('desserts',this)">Shakes</button>
  <button class="mnav-btn" onclick="scrollToSection('faloodas',this)">🍨 Faloodas</button>
  <button class="mnav-btn" onclick="scrollToSection('lassi',this)">🥛 Lassi</button>
  <button class="mnav-btn" onclick="scrollToSection('Icecreams',this)">Ice Creams</button>
</div>

<!-- MENU SECTIONS -->
<section class="menu-section" id="coffees"></section>
<section class="menu-section" id="cold"></section>
<section class="menu-section" id="shakes"></section>
<section class="menu-section" id="desserts"></section>
<section class="menu-section" id="faloodas"></section>
<section class="menu-section" id="lassi"></section>
<section class="menu-section" id="Icecreams"></section>

<footer>
  <div class="f-logo">
    MACH <em style="color:var(--caramel)">Cafe</em>
  </div>

  <ul class="f-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="men.html">Menu</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>

  <div class="f-copy">
    © 2026 MACH Cafe ·
  </div>
</footer>

<script>
// SCROLL
function scrollToSection(id, btn) {
  document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
  document.querySelectorAll('.mnav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// SECTION DETAILS — matches menu.html exactly
const SECTION_META = {
  coffees:{
    icon:'☕',
    title:'Hot Coffees & Beverages',
    desc:'Single-origin espresso and handcrafted coffee.'
  },
  cold:{
    icon:'🧊',
    title:'Juices',
    desc:'Cold pressed juices and detox blends.'
  },
  shakes:{
    icon:'🥤',
    title:'Mojitos',
    desc:'Refreshing house-made mojitos in every flavour.'
  },
  desserts:{
    icon:'🍰',
    title:'Shakes',
    desc:'Creamy shakes, oreo specials and chilled lassi.'
  },
  Icecreams:{
    icon:'🍦',
    title:'Ice Creams',
    desc:'Scoops and cones of your favourite flavours.'
  },
  Biscuits:{
    icon:'🥛',
    title:'Falooda & Lassi',
    desc:'Classic falooda, chilled lassi and biscuit accompaniments.'
  },

  faloodas:{
    icon:'🍨',
    title:'Faloodas',
    desc:'Chilled falooda in assorted flavours — rose, pista, mango & more.'
  },

  lassi:{
    icon:'🥛',
    title:'Lassi',
    desc:'Rich, creamy lassi — sweet, salty, mango and more.'
  }
  
};

// LOAD MENU FROM DATABASE
async function loadMenu() {
  try {
    const res  = await fetch('/api/menu');
    const data = await res.json();
    if (!data.success) throw new Error('Menu API failed');
    renderAllSections(data.items);
  } catch(err) {
    console.error('Error loading menu:', err);
  }
}

// RENDER ALL SECTIONS
function renderAllSections(items) {
  // Remap: Falooda items → 'faloodas' section, Lassi items → 'lassi' section
  // Items may come from DB as section='Biscuits' (legacy) or 'shakes-falooda' / 'shakes'
  items = items.map(item => {
    if (item.description === 'Falooda' || (item.section === 'Biscuits' && item.description && item.description.toLowerCase().includes('falooda'))) {
      return { ...item, section: 'faloodas' };
    }
    if (item.description === 'Lassi' || (item.section === 'Biscuits' && item.description && item.description.toLowerCase().includes('lassi'))) {
      return { ...item, section: 'lassi' };
    }
    if (item.section === 'Biscuits') {
      // Remaining Biscuits items: check name for falooda/lassi keyword, else default to faloodas
      const n = item.name.toLowerCase();
      if (n.includes('lassi')) return { ...item, section: 'lassi' };
      return { ...item, section: 'faloodas' };
    }
    return item;
  });
  const sectionOrder = [...Object.keys(SECTION_META)];
  items.forEach(i => { if (!sectionOrder.includes(i.section)) sectionOrder.push(i.section); });

  const bySection = {};
  sectionOrder.forEach(id => bySection[id] = []);
  items.forEach(i => {
    if (!bySection[i.section]) bySection[i.section] = [];
    bySection[i.section].push(i);
  });

  for (const secId of sectionOrder) {
    const secItems = bySection[secId];
    let section = document.getElementById(secId);

    if (!section && secItems && secItems.length) {
      section = document.createElement('section');
      section.className = 'menu-section';
      section.id = secId;
      const footer = document.querySelector('footer');
      footer.parentNode.insertBefore(section, footer);
    }

    if (!section || !secItems || !secItems.length) continue;

    const meta = SECTION_META[secId] || {
      icon: secItems[0]?.emoji || '🍽️',
      title: secId,
      desc: ''
    };

    section.innerHTML = `
      <div class="sec-header">
        <div style="display:flex;align-items:center">
          <span class="sec-icon">${meta.icon}</span>
          <span class="sec-title">${meta.title}</span>
        </div>
        <div class="sec-desc">${meta.desc}</div>
      </div>
      <div class="items-grid" id="grid-${secId}"></div>
    `;

    const grid = document.getElementById(`grid-${secId}`);
    secItems.forEach(item => grid.insertAdjacentHTML('beforeend', buildCard(item)));
  }
}

// BUILD CARD — display-only (no add-to-cart button)
function buildCard(item) {
  const oos      = item.isAvailable === false;
  const oosClass = oos ? ' oos' : '';
  const oosBadge = oos ? '<span class="badge oos-badge">Out of Stock</span>' : '';
  const badgeHtml = item.badge ? `<span class="badge badge-hot">${item.badge}</span>` : '';

  const displayPrice = (item.rawPrice && item.rawPrice !== String(item.price))
    ? '₹' + item.rawPrice
    : '₹' + Number(item.price).toLocaleString('en-IN');

  if (item.isFeatured) {
    return `
      <div class="item-card featured${oosClass}" data-name="${item.name}">
        <div class="featured-visual">${item.emoji || '☕'}</div>
        <div style="flex:1">
          <div class="featured-tag">${item.badge || 'Featured'}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.description || ''}</div>
          <div class="item-footer">
            <span class="item-price">${displayPrice}</span>
            ${oosBadge}
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="item-card${oosClass}" data-name="${item.name}">
      <div class="item-card-top">
        <span class="item-emoji">${item.emoji || '☕'}</span>
        <div class="item-badges">${badgeHtml}${oosBadge}</div>
      </div>
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.description || 'Freshly prepared with premium ingredients.'}</div>
      <div class="item-footer">
        <span class="item-price">${displayPrice}</span>
      </div>
    </div>`;
}

// HAMBURGER
const navToggle = document.getElementById('navToggle');
const navLinks  = document.getElementById('navLinks');
navToggle.addEventListener('click', () => {
  navToggle.classList.toggle('open');
  navLinks.classList.toggle('open');
});
navLinks.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    navToggle.classList.remove('open');
    navLinks.classList.remove('open');
  });
});

// START
loadMenu();
</script>

</body>
</html>
